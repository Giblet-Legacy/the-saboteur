# pytest.ini — test collection for the-saboteur 1.0.0
#
# Function:
#     Collect only tests/. archive/0.9.0/ holds the frozen 0.x layers and
#     their suites byte for byte (CONSOLIDATION_V1.md §4.4). They import
#     their siblings and do not run from the archive, so they are never
#     collected; run them from a worktree of the tag v0.9.0.
#
# Version:  1.0.0 (frozen 2026-11-20)
# Licence:  MSL-1.0
# Author:   James Gilbert (Giblets Forge)

[pytest]
testpaths = tests
norecursedirs = archive harness_canaries .git __pycache__
